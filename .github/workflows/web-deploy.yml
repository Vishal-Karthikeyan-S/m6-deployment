name: Build and Deploy Flutter Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/web-deploy.yml'
    paths-ignore:
      - 'web-release/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Build Web
        run: flutter build web --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
        working-directory: frontend

      - name: Commit Web Release to Main
        run: |
          mkdir -p web-release
          rm -rf web-release/*
          cp -r frontend/build/web/* web-release/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web-release/
          git commit -m "chore: update web-release artifacts [skip ci]" || echo "No changes to commit"
          git push origin main
